<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numerical Methods Studio</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#0b1020;--p:#7c5cff;--c:#22d3ee;--tx:#e8ecf8;--mu:#8a93b2;--bd:rgba(255,255,255,.09);--cd:rgba(255,255,255,.05)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;display:flex;min-height:100vh;font:15px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--tx);
background:radial-gradient(900px 500px at 85% -10%,#3b2a8f66,transparent),radial-gradient(700px 400px at 0 100%,#0e749055,transparent),var(--bg)}
aside{width:250px;padding:28px 18px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
aside h1{margin:0;font-size:22px;line-height:1.2;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
aside small{margin-top:auto;color:var(--mu);font-size:12px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{all:unset;cursor:pointer;padding:10px 14px;border-radius:12px;color:var(--mu);transition:.2s}
nav button:hover{background:var(--cd);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,#7c5cff33,#22d3ee22);color:var(--tx);box-shadow:inset 0 0 0 1px #7c5cff66}
main{flex:1;padding:32px;max-width:1100px;min-width:0}
h2{margin:0;font-size:28px}header p{margin:4px 0 20px;color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:18px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu)}
.fld.w{grid-column:1/-1}
input,select,textarea{background:#0a0f1f;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;outline:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #7c5cff33}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:10px;margin-top:18px}
button.go,button.gh{cursor:pointer;border:0;border-radius:12px;padding:11px 22px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--p),#4f8cff);transition:.2s}
button.go:hover{transform:translateY(-1px);box-shadow:0 8px 24px #7c5cff55}
button.gh{background:var(--cd);border:1px solid var(--bd);color:var(--mu)}
#err{color:#ff7b8a;margin:12px 0 0;min-height:1em}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.chip{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}
.chip span{display:block;font-size:12px;color:var(--mu)}.chip b{font-size:17px;word-break:break-all}
.chip.hl{border-color:#22d3ee77;box-shadow:0 0 24px #22d3ee22}
.tw{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%;font:13px ui-monospace,Consolas,monospace}
th,td{padding:9px 14px;text-align:right;white-space:nowrap}
th{color:var(--mu);font-weight:600;background:#ffffff08;position:sticky;top:0}
tr:nth-child(even) td{background:#ffffff05}tr.best td{background:#22d3ee1c;color:#7ff0ff}
.msg{color:#ffc46b;margin-bottom:12px}
#ld{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--mu)}
.sp{width:46px;height:46px;border-radius:50%;border:4px solid #ffffff1a;border-top-color:var(--c);animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:800px){body{flex-direction:column}aside{width:auto;height:auto;position:static;border:0}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}main{padding:18px}}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div><p id="lt">Loading Python engine… (first load takes a few seconds)</p></div>
<aside><h1>∑ Numerical<br>Methods Studio</h1><nav id="nav"></nav><small>Python runs inside your browser via Pyodide.</small></aside>
<main>
<header><h2 id="t"></h2><p id="sub"></p></header>
<section class="card"><div id="form" class="grid"></div>
<div class="row"><button class="go" id="go">Solve ▸</button><button class="gh" id="rs">Reset</button></div><p id="err"></p></section>
<div id="out"></div>
</main>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const F0="x^3 - x - 2";
const MS={
 bisection:{n:"Bisection",d:"Bracketing method: halves the interval until the root is trapped.",c:"Bisection",s:1,f:[["f","f(x)","text",F0,0,1],["xl","xl","number",1],["xu","xu","number",2]]},
 newton:{n:"Newton-Raphson",d:"Fast open method that uses the symbolic derivative f′(x).",c:"Newton",s:1,f:[["f","f(x)","text",F0,0,1],["x0","x(0)","number",1.5]]},
 secant:{n:"Secant / Modified Secant",d:"Derivative-free: secant uses two points, modified uses a small perturbation δ.",c:"Secant",s:1,
  f:[["m","Method","select","1",0,0,["1|Secant","2|Modified Secant"]],["f","f(x)","text",F0,0,1],["xm","x(-1)","number",1,"1"],["x0","x(0)","number",2],["delta","δ","number",0.01,"2"]]},
 jacobi:{n:"Jacobi / Gauss-Seidel",d:"Iterative solvers for linear systems A·x = b.",c:"Jacobi",s:1,
  f:[["m","Method","select","2",0,0,["1|Jacobi","2|Gauss-Seidel"]],["M","Augmented matrix [A | b] — one row per line","mat","10 2 1 13\n1 8 2 11\n2 1 9 12",0,1],["x0","Initial guesses","list","0 0 0"]]},
 regression:{n:"Linear Regression",d:"Least-squares line with St, Sr, r² and prediction.",c:"Regression",s:0,
  f:[["x","X values","list","1 2 3 4 5",0,1],["y","Y values","list","2.1 3.9 6.2 7.8 10.1",0,1]]}
};
let cur,py;
const nums=s=>s.split(/[\s,;]+/).filter(Boolean).map(Number);

function build(k){
 cur=k;const c=MS[k];$("#t").textContent=c.n;$("#sub").textContent=c.d;$("#out").innerHTML="";$("#err").textContent="";
 $$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==k));
 const fs=[...c.f];
 if(c.s)fs.push(["es","es (%) — optional","number","",0,0],["n","Max iterations — optional","number","",0,0],["xt",k=="jacobi"?"True values — optional":"True value — optional",k=="jacobi"?"list":"number","",0,0]);
 $("#form").innerHTML=fs.map(([id,l,t,v,o,w,opt])=>{
  const a=`id="${id}"`+(o?` data-o="${o}"`:"");
  const i=t=="select"?`<select ${a}>${opt.map(x=>{const[p,q]=x.split("|");return `<option value="${p}" ${p==v?"selected":""}>${q}</option>`}).join("")}</select>`
   :t=="mat"?`<textarea ${a}>${v}</textarea>`:`<input ${a} type="${t=="number"?"number":"text"}" step="any" value="${v}">`;
  return `<label class="fld ${w?"w":""}" ${o?`data-o="${o}"`:""}><span>${l}</span>${i}</label>`}).join("");
 const m=$("#m"),vis=()=>$$(".fld[data-o]").forEach(e=>e.hidden=!!m&&e.dataset.o!=m.value);
 if(m){m.onchange=vis;vis()}
}
function collect(){
 const c=MS[cur],d={method:c.c},g=id=>$("#"+id).value.trim();
 const fs=[...c.f,["es",0,"number"],["n",0,"number"],["xt",0,cur=="jacobi"?"list":"number"]];
 fs.forEach(([id,,t])=>{const e=$("#"+id);if(!e)return;const v=g(id);
  if(t=="number"){if(v!=="")d[id]=+v}
  else if(t=="list"){const a=nums(v);if(a.length)d[id]=a}
  else if(t=="mat"){const R=v.split("\n").filter(r=>r.trim()).map(nums);d.A=R.map(r=>r.slice(0,-1));d.b=R.map(r=>r.at(-1))}
  else d[id]=v});
 if(c.s&&d.n===undefined)d.n=100;
 return d;
}
const fmt=(k,v)=>v==null?"–":typeof v!="number"?v:k=="i"?v:(v!==0&&(Math.abs(v)>=1e7||Math.abs(v)<1e-8))?v.toExponential(4):v.toFixed(k=="ea"||k=="et"?6:8);
const chip=(l,v,h)=>`<div class="chip ${h?"hl":""}"><span>${l}</span><b>${v}</b></div>`;
function table(cols,rows,bi){
 cols=cols.filter(([k])=>rows.some(r=>r[k]!=null));
 return `<table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr>${rows.map(r=>`<tr class="${bi&&r.i==bi?"best":""}">${cols.map(([k])=>`<td>${fmt(k,r[k])}</td>`).join("")}</tr>`).join("")}</table>`;
}
const lay=(t,x,y)=>({title:{text:t,font:{size:14}},paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{color:"#c9d1ee"},margin:{t:40,r:10,b:45,l:55},
 xaxis:{title:x,gridcolor:"#ffffff14",zerolinecolor:"#ffffff55"},yaxis:{title:y,gridcolor:"#ffffff14",zerolinecolor:"#ffffff55"},legend:{orientation:"h",y:-.25}});
const plot=(tr,l)=>Plotly.newPlot("ch",tr,l,{responsive:true,displaylogo:false});

function show(r){
 let h="";
 if(r.kind=="root"){
  h=(r.msg?`<p class="msg">${r.msg}</p>`:"")+(r.note?`<p class="msg" style="color:var(--c)">${r.note}</p>`:"")+`<div class="chips">`+
   chip("Last estimate",fmt("x",r.last))+chip("f(last)",fmt("x",r.fl))+chip(`Best root (iter ${r.bi??"–"})`,fmt("x",r.best),1)+chip("f(best)",fmt("x",r.fb),1)+chip("Iterations",r.rows.length)+`</div>`;
 }else if(r.kind=="sys"){
  const L=r.rows.at(-1),B=r.rows.find(q=>q.i==r.bi)||L;
  h=`<div class="chips">`+Array.from({length:r.n},(_,k)=>chip("x"+(k+1),fmt("x",L["x"+(k+1)]),1)).join("")+chip("Iterations",r.rows.length)+chip("Best iteration (min residual)",B.i)+chip("Residual",fmt("x",L.res))+`</div>`;
 }else{
  const s=r.stats;
  h=`<div class="chips">`+chip("Equation",`y = ${s.a0.toFixed(4)} + ${s.a1.toFixed(4)}·x`,1)+chip("r²",s.r2.toFixed(4))+chip("r",s.r.toFixed(4))+chip("St",s.St.toFixed(4))+chip("Sr",s.Sr.toFixed(4))+chip("sy",s.sy.toFixed(4))+chip("sy/x",s.syx.toFixed(4))+`</div>`+
   `<div class="card"><label class="fld">Predict y for a new x<input id="pp" type="number" step="any" placeholder="enter x"></label><b id="pr" style="font-size:18px"></b></div>`;
 }
 $("#out").innerHTML=h+`<div class="card"><div id="ch"></div></div><div class="card tw">${table(r.cols,r.rows,r.kind=="root"?r.bi:r.kind=="sys"?r.bi:0)}</div>`;
 if(r.kind=="root"){
  plot([{x:r.curve.map(p=>p[0]),y:r.curve.map(p=>p[1]),name:"f(x)",line:{color:"#7c5cff",width:3}},
   {x:r.pts.map(p=>p[0]),y:r.pts.map(p=>p[1]),mode:"markers",name:"iterations",marker:{color:"#34d399",size:9}},
   ...(r.best!=null?[{x:[r.best],y:[r.fb],mode:"markers",name:"best root",marker:{color:"#ff5c7a",size:13,symbol:"star"}}]:[])],lay(MS[cur].n,"x","f(x)"));
 }else if(r.kind=="sys"){
  plot(Array.from({length:r.n},(_,k)=>({x:Array.from({length:r.rows.length+1},(_,i)=>i),y:[r.init[k],...r.rows.map(q=>q["x"+(k+1)])],mode:"lines+markers",name:"x"+(k+1)})),lay((r.gs?"Gauss-Seidel":"Jacobi")+" convergence","Iterations","Value"));
 }else{
  const s=r.stats,lo=Math.min(...r.xs),hi=Math.max(...r.xs);
  plot([{x:r.xs,y:r.ys,mode:"markers",name:"data",marker:{color:"#22d3ee",size:10}},{x:[lo,hi],y:[s.a0+s.a1*lo,s.a0+s.a1*hi],mode:"lines",name:"fit",line:{color:"#ff5c7a",width:3}}],lay("Linear regression","x","y"));
  $("#pp").oninput=e=>$("#pr").textContent=e.target.value===""?"":"y = "+(s.a0+s.a1*e.target.value).toFixed(4);
 }
 $("#out").scrollIntoView({behavior:"smooth"});
}

$("#nav").innerHTML=Object.entries(MS).map(([k,c])=>`<button data-k="${k}">${c.n}</button>`).join("");
$("#nav").onclick=e=>e.target.dataset.k&&build(e.target.dataset.k);
$("#rs").onclick=()=>build(cur);
$("#go").onclick=()=>{
 $("#err").textContent="";
 try{show(JSON.parse(py.globals.get("run")(JSON.stringify(collect()))))}
 catch(e){$("#err").textContent="⚠ "+String(e.message).trim().split("\n").pop()}
};
build("bisection");
(async()=>{
 try{py=await loadPyodide();await py.loadPackage(["numpy","sympy"]);py.FS.writeFile("Numerical_Methods.py",await (await fetch("Numerical_Methods.py")).text());py.runPython(await (await fetch("bridge.py")).text());$("#ld").remove()}
 catch(e){$("#lt").textContent="Failed to load the Python engine: "+e.message+" (open the page through a local server, not by double-click, and check your internet connection)"}
})();
</script>
</body>
</html>
